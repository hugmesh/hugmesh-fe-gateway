name: Release

# Manual-only. This workflow is intentionally inert until a human enables it —
# no push/tag trigger. Mirrors the build this repo's .gitlab-ci.yml performs
# (docker build off the sibling hugmesh-gateway image via the GATEWAY_IMAGE
# build-arg), but publishes to GHCR instead of the in-cluster GitLab registry.
on:
  workflow_dispatch:
    inputs:
      gateway_image:
        description: >
          Sibling hugmesh-gateway base image (GATEWAY_IMAGE build-arg) this
          overlay builds FROM. hugmesh-gateway's release workflow publishes
          :latest and :<short sha> (there is no :main tag).
        required: false
        default: ghcr.io/hugmesh/hugmesh-gateway:latest
      tag:
        description: Tag to publish the built image under.
        required: false
        default: latest

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-fe-gateway

jobs:
  build-and-push:
    # RUNS_ON is an org/repo variable holding a JSON array of runner labels;
    # fall back to the GitHub-hosted runner when it is unset.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the base image can be pulled
        env:
          GATEWAY_IMAGE: ${{ inputs.gateway_image }}
        run: |
          if [ -z "$GATEWAY_IMAGE" ]; then
            echo "::error::gateway_image is empty; pass a hugmesh-gateway tag (latest or a short sha)"
            exit 1
          fi
          if ! docker manifest inspect "$GATEWAY_IMAGE" >/dev/null 2>&1; then
            echo "::error::cannot pull base image $GATEWAY_IMAGE (missing tag or package access). Run the hugmesh-gateway Release workflow first, and grant this repository Read under that package's Manage Actions access."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GATEWAY_IMAGE=${{ inputs.gateway_image }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
