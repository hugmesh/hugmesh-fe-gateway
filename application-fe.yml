spring:
  application:
    name: snapdragon-fe-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}
  cloud:
    gateway:
      # SCG 5.0 (Spring Boot 4) moved route config to
      # spring.cloud.gateway.server.webflux.* — the legacy spring.cloud.gateway.routes
      # prefix binds NOTHING under SCG 5.0 (silent empty list), so this fallback
      # route must live under server.webflux to be honoured.
      #
      # Keep this default route/URI in sync with the seeded row in
      # liquibase/changelog/001-gateway-routes.xml (route_id=fe-default).
      server:
        webflux:
          routes:
            - id: fe-default
              uri: ${DOWNSTREAM_URI:http://snapdragon-systems-web.snapdragon-frontend.svc.cluster.local:80}
              predicates:
                - Path=/**
