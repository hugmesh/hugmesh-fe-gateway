spring:
  application:
    name: hugmesh-fe-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CASDOOR_ISSUER_URI:https://id.hugmesh.systems}
  cloud:
    gateway:
      # SCG 5.0 (Spring Boot 4) moved route config to
      # spring.cloud.gateway.server.webflux.* — the legacy spring.cloud.gateway.routes
      # prefix binds NOTHING under SCG 5.0 (silent empty list), so this fallback
      # route must live under server.webflux to be honoured.
      #
      # Keep this default route/URI in sync with the seeded row in
      # liquibase/changelog/001-gateway-routes.xml (route_id=fe-default).
      #
      # NOTE: neither the production Helm chart nor the local compose stack
      # (both in hugmesh-generator) actually loads THIS file — they deploy
      # the base hugmesh-gateway image directly with SPRING_PROFILES_ACTIVE=
      # routes + their own Helm/compose-rendered application-routes.yml. See
      # the fe-gateway README's "Known gaps" section for the full evidence
      # trail before assuming an edit here changes real deployed behaviour.
      server:
        webflux:
          routes:
            - id: fe-default
              uri: ${DOWNSTREAM_URI:http://hugmesh-systems-web.hugmesh-frontend.svc.cluster.local:80}
              predicates:
                - Path=/**
