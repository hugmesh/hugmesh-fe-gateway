# Snapdragon CI — build + push this per-node gateway image to the in-cluster
# GitLab registry. This image OVERLAYS the shared snapdragon-gateway image, so CI
# bases the build off that sibling image in the same registry namespace (via the
# GATEWAY_IMAGE build-arg). Runs on the privileged x86 runner. No keys baked in.
stages: [build]

build:image:
  stage: build
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # Base off the sibling snapdragon-gateway image in the same registry namespace.
    - export GATEWAY_IMAGE="${CI_REGISTRY_IMAGE%/*}/snapdragon-gateway:${CI_COMMIT_REF_SLUG}"
    - docker build --pull --build-arg GATEWAY_IMAGE="$GATEWAY_IMAGE" -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
